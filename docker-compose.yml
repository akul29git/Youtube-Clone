
#   Development: docker compose --profile dev up --build
#   Production : docker compose --profile prod up -d --build
#   Scale API  : docker compose --profile prod up -d --build --scale backend=3
#   Stop       : docker compose --profile dev down   (or --profile prod)

name: video-tube

services:

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    container_name: video-tube-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: development
      PORT: 8000
      CORS_ORIGIN: http://localhost:5173   # the Vite dev server origin
    volumes:
      - ./backend:/app                     # host edits appear instantly
      - /app/node_modules                  # keep the container's own modules
    command: npm run dev                   # needs: "dev": "nodemon -L src/index.js"

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    container_name: video-tube-frontend-dev
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend-dev

 
  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      target: prod
    image: video-tube-backend:prod
    # no container_name: it must be omitted so you can use --scale backend=N
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
    expose:
      - "8000"                             # visible to other containers only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}   # baked in at build time
    image: video-tube-frontend:prod
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    container_name: video-tube-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"              # the only public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend